<!DOCTYPE html>

<title>Ableton About · Architecture</title>
<!-- diagram-design · architecture type · style guide customised from DESIGN.md (option c: local design system):
     paper #ffffff, ink #000000, muted #333333, accent (coral role) #c93c0f, link role #0000ff, sans Jost -->
<style>
  @font-face{font-family:'Jost Variable';font-weight:100 900;src:url(../../node_modules/@fontsource-variable/jost/files/jost-latin-wght-normal.woff2) format('woff2-variations');}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--paper:#fff;--ink:#000;--muted:#333;--accent:#c93c0f;--font-sans:'Jost Variable',Jost,system-ui,sans-serif;--font-mono:ui-monospace,'SF Mono',Menlo,monospace}
  body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);display:flex;justify-content:center;padding:3rem 2rem}
  .frame{max-width:1000px;width:100%}
  .eyebrow{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
  h1{font-size:2rem;font-weight:500;letter-spacing:-.02em;margin-bottom:1.5rem}
  svg{width:100%;min-width:860px;display:block}
  .note{margin-top:1rem;font-size:.95rem;color:var(--muted);max-width:62ch}
</style>
</head>
